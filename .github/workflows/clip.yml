name: yt-clip

on:
  repository_dispatch:
    types: [video_published]
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube video ID (dari URL watch?v=XXXX) untuk test manual"
        required: false

permissions:
  contents: write

jobs:
  clip:
    environment: YT_CHANNEL_ID
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install deps
        run: |
          python -m pip install -U pip uv
          uv pip install --system -r requirements.txt
          python -m playwright install chromium

      - name: Setup ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify tools
        run: |
          ffmpeg -version | head -1
          node --version
          yt-dlp --version

      - name: Preflight - cek semua credential
        env:
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
          YT_UPLOAD_CLIENT: ${{ secrets.YT_UPLOAD_CLIENT }}
          YT_UPLOAD_SECRET: ${{ secrets.YT_UPLOAD_SECRET }}
          YT_UPLOAD_TOKEN: ${{ secrets.YT_UPLOAD_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python preflight.py

      - name: Download raw + clip + upload
        env:
          VIDEO_ID: ${{ github.event.client_payload.video_id || github.event.inputs.video_id }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
          YTDLP_JS_RUNTIME: node
          YT_UPLOAD_CLIENT: ${{ secrets.YT_UPLOAD_CLIENT }}
          YT_UPLOAD_SECRET: ${{ secrets.YT_UPLOAD_SECRET }}
          YT_UPLOAD_TOKEN: ${{ secrets.YT_UPLOAD_TOKEN }}
          YT_READ_TOKEN: ${{ secrets.YT_READ_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          STATE_FILE: state.json
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_FB_PAGE_ID: ${{ secrets.META_FB_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
        run: python clip.py

      - name: Save state (anti double-clip)
        if: always()
        run: |
          git config user.email "bot@github.com"
          git config user.name "clip-bot"
          git add state.json || true
          git commit -m "update state" || true
          git push || true

      - name: Upload clip artifacts (debug subtitle/visual/thumbnail/metadata)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yt-clips-${{ github.run_id }}
          path: |
            /tmp/yt_clip/part_*.mp4
            /tmp/yt_clip/clip_*.mp4
            /tmp/yt_clip/cap_*.ass
            /tmp/yt_clip/thumb_*.jpg
            /tmp/yt_clip/frames/*.jpg
            /tmp/yt_clip/meta_*.json
          if-no-files-found: warn
          retention-days: 7
